<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UZ Connect</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    {% load static %}
    <script src="{% static 'js/main.js' %}"></script>

    {% load static %}
    <link rel="shortcut icon" type="image/png" href="{% static 'img/favicon.ico' %}">

    <style>
    .hero-pic{
        background-image: url("{% static 'img/uz.jpg' %}") ;
        background-size: cover;
        height:500px;
    }
    .biz-pic{
        background-image: url("{% static 'img/biz.jpeg' %}") ;
        background-size: cover;
        height:500px;
    }
    .good-pic{
        background-image: url("{% static 'img/goods.png' %}") ;
        background-size: cover;
        height:500px;
    }
    .mobile{
        display: none;
    }
    @media only screen and (max-width:768px){
        .hero-pic{
            background-image: url("{% static 'img/uz.jpg' %}") ;
            height:30vh;
        }
        .desktop{
            display: none;
        }
        .mobile{
            display: flex;
            flex-direction: row;
            background-color: navy;
            width: 100vw;
        }
        .mobile a{
            display: block;
            color: white;
            font-size: 12px;
            padding: 4px;
        }
        .good-pic{
            background-image: url("{% static 'img/goods.png' %}") ;
            height:30vh;
        }
        .biz-pic{
            background-image: url("{% static 'img/biz.jpeg' %}") ;
            height:30vh;
        }
    }
    </style>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif">
    <div class="username">
        <span>Hello {{request.user}} <a href="/community/logout/">Logout</a></span>
    </div>
    <div class="hero">
        <span class="logo" onclick="location.href='/'"><span style="color: navy;">UZ</span><span style="color: orange;">C</span>onnect</span>
        <div class="desktop">
            <nav class="menu">
                <ul>
                    <li><a href="/">HOME</a></li>
                    <li><a href="/community/">COMMUNITY</a></li>
                    <li><a href="/biz/">CAMPUS BIZ</a></li>
                    <li><a href="/votings/">POLLS</a></li>
                    <li><a href="/biz/post/">POST</a></li>
                    <li><a href="/community/myaccount/">MY ACCOUNT</a></li>
                </ul>
            </nav>
        </div>
        <div class="mobile">
            <a href="/">HOME</a>
            <a href="/community/">COMMUNITY</a>
            <a href="/biz/">CAMPUS BIZ</a>
            <a href="/votings/">POLLS</a>
            <a href="/biz/post/">POST</a>
            <a href="/community/myaccount/">MY ACCOUNT</a>
        </div>
    </div>
    <div>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
